name: Release Monitor



on:

  push:

    branches: [main]

    tags: ["v*"]

  workflow_dispatch:



permissions:

  contents: write



jobs:

  build-release:

    runs-on: windows-latest

    defaults:

      run:

        shell: pwsh

    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

          cache-dependency-path: monitor/requirements.txt



      - name: Setup .NET

        uses: actions/setup-dotnet@v4

        with:

          dotnet-version: "8.0.x"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r monitor/requirements.txt pyinstaller



      - name: Build release

        env:

          GITHUB_SHA: ${{ github.sha }}

        run: |

          $version = (Get-Content monitor/VERSION -Raw).Trim()

          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {

            $version = "${{ github.ref_name }}".TrimStart("v")

          }

          ./monitor/build/build.ps1 -AppVersion $version



      - name: Install Inno Setup

        if: startsWith(github.ref, 'refs/tags/v')

        run: choco install innosetup -y



      - name: Build installer

        if: startsWith(github.ref, 'refs/tags/v')

        run: |

          $version = "${{ github.ref_name }}".TrimStart("v")

          ./monitor/build/build-installer.ps1 -AppVersion $version



      - name: Upload artifacts

        uses: actions/upload-artifact@v4

        with:

          name: Sentinel-${{ github.sha }}

          path: |

            monitor/dist/Sentinel.zip

            monitor/dist/Sentinel-*.zip

            monitor/dist/Sentinel-Setup.exe

            monitor/dist/GnBotsMonitor-Release/



      - name: Publish GitHub Release

        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ github.ref_name }}

          name: Sentinel ${{ github.ref_name }}

          files: |

            monitor/dist/Sentinel-Setup.exe

            monitor/dist/Sentinel.zip

          body: |

            ## Sentinel ${{ github.ref_name }}



            ### Highlights

            - Native **Sentinel.exe** launcher with splash screen

            - Desktop setup wizard (**SentinelSetup.exe**)

            - System tray (**SentinelTray.exe**)

            - PyInstaller monitor backend (no Python install required)



            **Recommended download:** `Sentinel-Setup.exe`

          generate_release_notes: true

          prerelease: false

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

